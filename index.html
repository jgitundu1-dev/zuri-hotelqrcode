<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuri Hotel - QR Code</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="qr-card">
        <div class="hotel-logo">ZURI</div>
        <p class="subtitle">HOTEL & RESORT</p>

        <h1>Welcome to Zuri Hotel</h1>
        <p class="description">
            Scan the QR code to explore our hotel, view our services,
            make a reservation, or contact us.
        </p>

        <div id="qrcode"></div>

        <p class="scan-text">Scan to discover Zuri Hotel</p>

        <button id="downloadBtn">Download QR Code</button>
    </div>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
